name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: home-portal-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set image name
        id: image
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ vars.COOLIFY_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Queue immutable image through Coolify
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_WEBHOOK_SECRET: ${{ secrets.COOLIFY_WEBHOOK_SECRET }}
          DEPLOY_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          DELIVERY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib
          import hmac
          import json
          import os
          import urllib.error
          import urllib.request
          import uuid

          revision = os.environ["DEPLOY_SHA"]
          message = "Deploy revision " + revision
          payload = {
              "ref": "refs/heads/main",
              "after": revision,
              "repository": {"full_name": os.environ["REPOSITORY"]},
              "head_commit": {"id": revision, "message": message},
              "commits": [{"id": revision, "message": message}],
          }
          body = json.dumps(payload, separators=(",", ":")).encode()
          signature = "sha256=" + hmac.new(
              os.environ["COOLIFY_WEBHOOK_SECRET"].encode(),
              body,
              hashlib.sha256,
          ).hexdigest()

          request = urllib.request.Request(
              os.environ["COOLIFY_WEBHOOK_URL"],
              method="POST",
              data=body,
              headers={
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "X-GitHub-Event": "push",
                  "X-GitHub-Delivery": os.environ.get("DELIVERY_ID") or str(uuid.uuid4()),
                  "X-Hub-Signature-256": signature,
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              raise RuntimeError(f"Coolify webhook failed with HTTP {error.code}") from None

          entries = result if isinstance(result, list) else [result]
          accepted = [
              entry for entry in entries
              if isinstance(entry, dict)
              and entry.get("status") == "success"
              and entry.get("deployment_uuid")
          ]
          if len(accepted) != 1:
              raise RuntimeError("Coolify did not accept exactly one deployment")
          print("Coolify queued deployment " + accepted[0]["deployment_uuid"])
          PY
