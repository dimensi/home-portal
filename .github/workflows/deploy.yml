name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: home-portal-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set image name
        id: image
        run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.image }}:latest
            ${{ steps.image.outputs.image }}:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: production
    if: ${{ vars.COOLIFY_DEPLOY_ENABLED == 'true' }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Deploy and verify immutable image through Coolify
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          base = os.environ["COOLIFY_URL"].rstrip("/") + "/api/v1"
          application = os.environ["COOLIFY_APP_UUID"]
          revision = os.environ["DEPLOY_SHA"]

          def api(method, path, data=None):
              request = urllib.request.Request(
                  base + path,
                  method=method,
                  data=json.dumps(data).encode() if data is not None else None,
                  headers={
                      "Authorization": "Bearer " + os.environ["COOLIFY_TOKEN"],
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  raise RuntimeError(f"Coolify request failed with HTTP {error.code}") from None

          # Git Compose applications inject this pinned revision as SOURCE_COMMIT.
          api("PATCH", "/applications/" + application, {"git_commit_sha": revision})
          deployment = api("POST", "/deploy", {"uuid": application})["deployments"][0]["deployment_uuid"]
          print("Coolify queued deployment " + deployment)
          for attempt in range(120):
              state = api("GET", "/deployments/" + deployment)
              if state["commit"] != revision:
                  raise RuntimeError("Coolify deployment revision does not match the release")
              if state["status"] == "finished":
                  break
              if state["status"] in {"failed", "cancelled", "cancelled-by-user"}:
                  raise RuntimeError("Coolify deployment " + state["status"])
              time.sleep(5)
          else:
              raise RuntimeError("Timed out waiting for Coolify deployment")

          for attempt in range(30):
              state = api("GET", "/applications/" + application)
              if state["git_commit_sha"] != revision:
                  raise RuntimeError("Coolify application revision changed during deployment")
              if state["status"] == "running:healthy":
                  print("Coolify deployed healthy revision " + revision)
                  break
              time.sleep(2)
          else:
              raise RuntimeError("Coolify application did not become healthy")
          PYTHON
